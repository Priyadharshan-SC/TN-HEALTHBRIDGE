name: Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Synthetic Configuration Registries
        run: |
          python -c "import json; json.load(open('data/terminology/default_registry.json'))"
          python -c "import json; json.load(open('data/identity/synthetic_identity_registry.json'))"
          python -c "import json; json.load(open('data/identity/synthetic_linkage_fixtures.json'))"

      - name: Run Test Suite
        run: |
          pytest -v
